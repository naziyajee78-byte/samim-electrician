<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samim Electrician - New Delhi</title>

<style>
:root{
--bg:#ffffff;
--text:#111;
--card:#fff7e6;
--red:#e60000;
--yellow:#ffeb3b;
}

body{
margin:0;
padding:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
}

/* HEADER */
header{
text-align:center;
padding:80px 20px;
background:linear-gradient(135deg,#ffeb3b,#e60000);
color:#000;
position:relative;
overflow:hidden;
}

/* SPARK */
header::before{
content:"⚡ ⚡ ⚡ ⚡ ⚡";
position:absolute;
top:10px;
left:0;
width:100%;
text-align:center;
font-size:22px;
opacity:0.6;
animation:sparkBlink 1s infinite;
}

@keyframes sparkBlink{
0%{opacity:0.1;}
50%{opacity:1;}
100%{opacity:0.1;}
}

/* 3D TITLE */
header h1{
font-size:46px;
color:#fff;
text-shadow:
2px 2px 0 #000,
4px 4px 0 #e60000,
6px 6px 15px rgba(0,0,0,0.6);
animation:floatText 3s ease-in-out infinite;
}

@keyframes floatText{
0%{transform:translateY(0);}
50%{transform:translateY(-8px);}
100%{transform:translateY(0);}
}

/* EXPERIENCE */
.exp{
display:inline-block;
margin-top:12px;
background:#fff;
color:#e60000;
padding:8px 16px;
border-radius:25px;
font-weight:bold;
border:2px solid #ffeb3b;
animation:pulseExp 1.5s infinite;
}

@keyframes pulseExp{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

/* MENU */
.menu{
position:fixed;
top:15px;
left:15px;
font-size:30px;
cursor:pointer;
z-index:1000;
}

/* ADMIN PANEL */
#adminPanel{
display:none;
position:fixed;
top:60px;
left:15px;
background:#fff;
padding:15px;
border-radius:10px;
z-index:1000;
}

/* SEARCH */
.search-box{
text-align:center;
margin:20px;
}

.search-box input{
padding:10px;
width:60%;
border-radius:10px;
border:2px solid #e60000;
}

/* CONTAINER */
.container{
width:90%;
max-width:1100px;
margin:auto;
}

/* CARD */
.card{
background:#fff;
padding:20px;
margin:20px 0;
border-radius:15px;
border-left:5px solid #e60000;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* SERVICES */
.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:10px;
}

.service-box{
background:#ffeb3b;
padding:15px;
border-radius:10px;
text-align:center;
font-weight:bold;
transition:0.3s;
}

.service-box:hover{
background:#e60000;
color:white;
transform:scale(1.05);
}

/* BUTTON */
.btn{
display:inline-block;
padding:10px 18px;
background:#e60000;
color:white;
border-radius:8px;
text-decoration:none;
margin-top:10px;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:12px;
border-radius:50px;
color:white;
}

/* GALLERY */
.gallery img{
width:180px;
margin:10px;
border-radius:10px;
border:2px solid #ffeb3b;
}

/* FOOTER */
footer{
background:#e60000;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}
</style>
</head>

<body>

<!-- MENU -->
<div class="menu" onclick="toggleMenu()">≡</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
<button onclick="loginAdmin()">Admin Login</button><br><br>
<input type="file" id="fileInput">
<button onclick="uploadImage()">Upload Image</button>
</div>

<!-- HEADER -->
<header>
<h1>⚡ SAMIM ELECTRICIAN ⚡</h1>
<p>Trusted Electrical Service in Delhi</p>
<div class="exp">⚡ 36+ Years Experience</div>
</header>

<!-- SEARCH -->
<div class="search-box">
<input type="text" placeholder="Search services..." onkeyup="searchService(this.value)">
</div>

<div class="container">

<div class="card">
<h2>About Us</h2>
<p>📍 Shakurpur I Block 241, NSP Delhi 110034</p>
</div>

<div class="card">
<h2>Services</h2>
<div class="services">
<div class="service-box">House Wiring</div>
<div class="service-box">Fan Installation</div>
<div class="service-box">Switch Repair</div>
<div class="service-box">Shop Work</div>
</div>
</div>

<div class="card">
<h2>📸 Gallery</h2>
<div class="gallery" id="gallery"></div>
</div>

<div class="card">
<h2>Contact</h2>
<p>📞 9999853898</p>
<a class="btn" href="tel:9999853898">Call Now</a>
<a class="btn" target="_blank" href="https://wa.me/919999853898">WhatsApp</a>
</div>

</div>

<a class="whatsapp" href="https://wa.me/919999853898">💬</a>

<footer>
© 2026 Samim Electrician
</footer>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
apiKey: "PASTE_YOUR_KEY",
authDomain: "PASTE",
projectId: "PASTE",
storageBucket: "PASTE",
appId: "PASTE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const storage = getStorage(app);

/* MENU */
window.toggleMenu = function(){
let p=document.getElementById("adminPanel");
p.style.display=p.style.display==="block"?"none":"block";
};

/* LOGIN */
window.loginAdmin = async function(){
let pass = prompt("Enter Password");
try{
await signInWithEmailAndPassword(auth,"admin@email.com",pass);
alert("Admin Login Success");
}catch(e){
alert("Login Failed");
}
};

/* UPLOAD */
window.uploadImage = async function(){
let file=document.getElementById("fileInput").files[0];
if(!file){alert("Select file");return;}

const storageRef=ref(storage,"images/"+file.name);
await uploadBytes(storageRef,file);

const url=await getDownloadURL(storageRef);

let img=document.createElement("img");
img.src=url;
document.getElementById("gallery").appendChild(img);
};

/* SEARCH */
window.searchService=function(val){
document.querySelectorAll(".service-box").forEach(b=>{
b.style.display=b.innerText.toLowerCase().includes(val.toLowerCase())
?"block":"none";
});
};
</script>

</body>
</html>
